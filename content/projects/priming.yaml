sections:
  built:
    heading: What it does
    paragraphs:
      - Athletes complete a short check-in and a quick cognitive test. Combined with sleep and heart data from their watch, that gives a clear green, yellow or red read on whether to push, ease off or recover.
  how:
    heading: What I built
    paragraphs: []
    columns:
      - title: The web app
        text: The check-in flow, the cognitive tests and the scoring engine that implements a readiness model designed with Dr. Visintainer.
      - title: The iOS app
        text: Capacitor around the web app, with Apple Health import for sleep, HRV, resting heart rate and workouts, and a Codemagic build pipeline that ships to TestFlight.
      - title: The backend
        text: 57 server functions covered by 151 automated tests.
