          external: true
        - label: Case study
          href: /projects/sprout
howIBuild:
  heading: How I build
  paragraphs:
    - A lead chat owns the spec, the contracts and the backlog. Parallel coding agents build through GitHub issues and pull requests, each on its own branch. An overnight loop generates test users, fixes what breaks and audits the AI's live answers. I own the architecture, the decisions and the final call.
    - "Sprout proved the method in 24 hours: 3,084 generated users, 600 live AI outputs audited, failing checks from 3 to 0. This site is built the same way, in public."
  links:
    - label: See the repo
      href: https://github.com/beansprout21/bensproat-site
      external: true
  pipeline:
    - title: Lead chat
    - title: GitHub issues, PRs, labels
    - title: Parallel coding agents
    - title: "Overnight loop: generate, fix, audit"
