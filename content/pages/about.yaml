offKeyboard:
  heading: Off the keyboard
  image: /images/about-grass.jpg
  alt: Ben Sproat crouching in tall dry grass, in a navy shirt
  paragraph: I grew up fishing with my grandpa and hiking in Acadia. Two summers at a primitive wilderness camp in Vermont taught me to build a fire with a bow drill and to pay attention. I have captained most teams I played on, from travel soccer to a founding varsity pickleball team, and I spent five summers leading camp groups on kayaks, paddleboards and high ropes. The environment thread runs through the trail grant, nine Chesapeake Bay cleanups and the energy modeling work.
